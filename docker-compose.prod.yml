services:
  postgres:
    image: postgres:16-alpine
    container_name: prreviewpilot-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prreviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prreviewpilot_prod_secret}
      POSTGRES_DB: ${POSTGRES_DB:-prreviewpilot_prod}
    volumes:
      - prreviewpilot_postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prreviewpilot} -d ${POSTGRES_DB:-prreviewpilot_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prreviewpilot-network

  neo4j:
    image: neo4j:5-community
    container_name: prreviewpilot-prod-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-archadi_prod_neo4j_sec_88492019384729182}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=256m
    volumes:
      - prreviewpilot_neo4j_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - prreviewpilot-network

  redis:
    image: redis:7-alpine
    container_name: prreviewpilot-prod-redis
    restart: unless-stopped
    volumes:
      - prreviewpilot_redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prreviewpilot-network

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: prreviewpilot-prod-ai
    restart: unless-stopped
    environment:
      - PORT=8001
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-internal-ai-key}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - prreviewpilot-network

  indexer-service:
    build:
      context: ./apps/indexer-service
      dockerfile: Dockerfile
      target: prod
    container_name: prreviewpilot-prod-indexer
    restart: unless-stopped
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-archadi_prod_neo4j_sec_88492019384729182}
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - prreviewpilot_indexer_tmp_prod:/tmp/repos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - prreviewpilot-network

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: prreviewpilot-prod-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_DIR=/app/logs
      - PORT=4000
      - APP_URL=${APP_URL}
      - API_URL=${API_URL}
      - JWT_SECRET=${JWT_SECRET}
      - DATABASE_URL=postgres://${POSTGRES_USER:-prreviewpilot}:${POSTGRES_PASSWORD:-prreviewpilot_prod_secret}@postgres:5432/${POSTGRES_DB:-prreviewpilot_prod}
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-internal-ai-key}
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-archadi_prod_neo4j_sec_88492019384729182}
      - INDEXER_SERVICE_URL=http://indexer-service:8001
      - INNGEST_DEV=http://inngest:8288
      - INNGEST_BASE_URL=http://inngest:8288
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_APP_SLUG=${GITHUB_APP_SLUG}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - BITBUCKET_CLIENT_ID=${BITBUCKET_CLIENT_ID}
      - BITBUCKET_CLIENT_SECRET=${BITBUCKET_CLIENT_SECRET}
      - BITBUCKET_WEBHOOK_SECRET=${BITBUCKET_WEBHOOK_SECRET}
      - BITBUCKET_REDIRECT_URI=${BITBUCKET_REDIRECT_URI}
      - BREVO_API_KEY=${BREVO_API_KEY}
      - BREVO_SENDER_EMAIL=${BREVO_SENDER_EMAIL}
      - BREVO_SENDER_NAME=${BREVO_SENDER_NAME}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@prreviewpilot.archadi.dev}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin@123456}
    volumes:
      - ./logs:/app/logs
    ports:
      - "${API_PORT:-4060}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
      indexer-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - prreviewpilot-network

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: prreviewpilot-prod-web
    restart: unless-stopped
    environment:
      - INTERNAL_API_URL=http://api:4000
    ports:
      - "${WEB_PORT:-3060}:3000"
    depends_on:
      - api
    networks:
      - prreviewpilot-network

  inngest:
    image: inngest/inngest:latest
    container_name: prreviewpilot-prod-inngest
    restart: unless-stopped
    command: inngest dev -u http://api:4000/api/inngest
    depends_on:
      - api
    networks:
      - prreviewpilot-network

volumes:
  prreviewpilot_postgres_data_prod:
  prreviewpilot_redis_data_prod:
  prreviewpilot_neo4j_data_prod:
  prreviewpilot_indexer_tmp_prod:

networks:
  prreviewpilot-network:
    driver: bridge
