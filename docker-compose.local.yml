version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: reviewpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reviewpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-reviewpilot_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reviewpilot} -d ${POSTGRES_DB:-reviewpilot_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reviewpilot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
