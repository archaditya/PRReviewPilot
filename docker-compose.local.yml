version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: prreviewpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prreviewpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prreviewpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-prreviewpilot_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - prreviewpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prreviewpilot} -d ${POSTGRES_DB:-prreviewpilot_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: prreviewpilot-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - prreviewpilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prreviewpilot_postgres_data:
  prreviewpilot_redis_data:
